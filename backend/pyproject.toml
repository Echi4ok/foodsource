[project]
name = "foodsource-api"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163,<1",
    "pymorphy3>=2.0.6,<3",
    "pydantic>=2.12,<3",
    "uvicorn>=0.41,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.13,<3",
    "pytest>=9,<10",
    "ruff>=0.15,<1",
]
ingest = [
    "extruct==0.18.0",
    "py7zr>=1.1,<2",
    "scrapy>=2.14,<3",
    "tzdata>=2026.6",
]
overture = [
    "overturemaps==2.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "foodsource"]
